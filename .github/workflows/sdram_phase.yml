# Barrido del desfase de SDRAM_CLK (salida 1 del PLL, rtl/pll/pll_0002.v).
# Compila un .rbf por cada desfase: ZXP3_sdr2517.rbf, etc. Se lanza a mano:
# Actions > SDRAM phase sweep > Run workflow.
#
# El desfase se programa en pasos de 1/8 del periodo de la entrada de los
# contadores (397,25 MHz en GA: ~315 ps): c_cnt_prst1 = 1 + pasos/8 y
# c_cnt_ph_mux_prst1 = pasos % 8 (codificación comprobada con la PLL del core SNES).
# La simulacion temporizada (sim/sdram) da buen margen entre ~1,5 y ~3,5 ns.

name: SDRAM phase sweep

on:
  workflow_dispatch:
    inputs:
      phases:
        description: 'Desfases de SDRAM_CLK en ps (JSON)'
        required: true
        default: '[1259, 1888, 2517, 3146, 3775]'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(github.event.inputs.phases) }}

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Descargar el repositorio con los submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Desfase ${{ matrix.phase }} ps
        run: |
          STEPS=$(( (${{ matrix.phase }} * 8 * 3972528 + 5000000000) / 10000000000 ))
          PRST=$(( 1 + STEPS / 8 )); MUX=$(( STEPS % 8 ))
          echo "pasos=$STEPS prst=$PRST ph_mux=$MUX"
          sed -i -E 's/(\.phase_shift1\(")[0-9]+ ps/\1${{ matrix.phase }} ps/' rtl/pll/pll_0002.v
          sed -i -E "s/(\.c_cnt_prst1\()[0-9]+/\1$PRST/" rtl/pll/pll_0002.v
          sed -i -E "s/(\.c_cnt_ph_mux_prst1\()[0-9]+/\1$MUX/" rtl/pll/pll_0002.v
          grep -nE 'phase_shift1|c_cnt_prst1|c_cnt_ph_mux_prst1' rtl/pll/pll_0002.v

      - name: Descargar Quartus 17.0
        run: docker pull raetro/quartus:17.0

      - name: Compilar
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
            quartus_sh --flow compile zxp3

      - name: Detalle de tiempos de la SDRAM
        if: always()
        run: |
          if [ -f output_files/zxp3.sta.rpt ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
              quartus_sta -t tools/rutas_sdram.tcl
          fi

      - name: Resumen de tiempos
        if: always()
        run: |
          STA=output_files/zxp3.sta.rpt
          [ -f "$STA" ] || exit 0
          {
            echo "## SDRAM_CLK ${{ matrix.phase }} ps"
            echo '```'
            for s in "Setup Summary" "Hold Summary"; do
              echo "== $s"
              sed -n "/; $s/,/^$/p" "$STA" | grep -E '^; (SDRAM_CLK|emu\|pll\|)' | cut -c1-110
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar el resultado
        if: always()
        run: |
          mkdir -p dist
          [ -f output_files/zxp3.rbf ] && cp output_files/zxp3.rbf "dist/ZXP3_sdr${{ matrix.phase }}.rbf"
          for r in sta fit; do
            [ -f output_files/zxp3.$r.rpt ] && cp output_files/zxp3.$r.rpt "dist/ZXP3_sdr${{ matrix.phase }}.$r.rpt"
          done
          [ -f output_files/rutas_sdram.txt ] && cp output_files/rutas_sdram.txt "dist/rutas_sdram_${{ matrix.phase }}.txt"
          ls -la dist

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZXP3_sdr${{ matrix.phase }}
          path: dist/
          retention-days: 30
